name: Mission Block Trick17 V4

on:
  push:
    branches:
      - mission-block-trick17-v4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-trick17-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Trick17 V4 branch
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply Mission Block V4 instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/mission_research_patch.py
          python3 .github/scripts/mission_trick17_patch.py
          python3 .github/scripts/mission_v3_patch.py
          python3 .github/scripts/mission_v3_fixup.py
          python3 .github/scripts/mission_v4_patch.py
          grep -F 'MB_V4_TUNE' components/asic/bm1370.c
          grep -F 'target_unique=1024' components/asic/bm1370.c
          grep -F 'mb_version_bins[(rolled16 >> 3) & 31]' components/asic/bm1370.c
          grep -F 'MB_SPACE report=' components/asic/bm1370.c
          grep -F 'MB_WRAP' components/asic/bm1370.c
          grep -F 'MB_TX' components/asic/serial.c
          grep -F 'MB_SHARE_DUP' main/tasks/asic_result_task.c
          grep -F 'MB_STALE' main/tasks/asic_result_task.c
          grep -F 'MB_RECOVERY' components/asic/asic_common.c

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - name: Build web dist
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build
          path: '.'

      - name: Verify Trick17 V4 OTA
        shell: bash
        run: |
          set -euo pipefail
          test -s build/esp-miner.bin
          SIZE=$(stat -c%s build/esp-miner.bin)
          echo "Trick17 V4 OTA size: $SIZE bytes"
          test "$SIZE" -lt 4194304
          sha256sum build/esp-miner.bin > esp-miner-trick17-v4.sha256
          strings build/esp-miner.bin | grep -F 'MB_V4_TUNE'
          strings build/esp-miner.bin | grep -F 'target_unique=1024'
          strings build/esp-miner.bin | grep -F 'raw_auto=0'

      - name: Upload Mission Block Trick17 V4 OTA
        uses: actions/upload-artifact@v4
        with:
          name: esp-miner-mission-block-trick17-v4-ota
          path: |
            ./build/esp-miner.bin
            ./esp-miner-trick17-v4.sha256
          if-no-files-found: error
