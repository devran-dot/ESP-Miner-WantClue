name: Mission Block Research

on:
  push:
    branches:
      - mission-block-research-v1

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply BM1370 research instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/mission_research_patch.py
          grep -F 'MISSION_HCN_PERCENT 0.95' components/asic/bm1370.c
          grep -F 'MB_DUP' components/asic/bm1370.c
          grep -F 'MB_UART' components/asic/asic_common.c
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - name: Build web dist
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build
          path: '.'

      - name: Verify research OTA
        shell: bash
        run: |
          set -euo pipefail
          test -s build/esp-miner.bin
          SIZE=$(stat -c%s build/esp-miner.bin)
          echo "Research OTA size: $SIZE bytes"
          test "$SIZE" -lt 4194304
          sha256sum build/esp-miner.bin > esp-miner-research.sha256

      - name: Upload Mission Block Research OTA
        uses: actions/upload-artifact@v4
        with:
          name: esp-miner-mission-block-research-ota
          path: |
            ./build/esp-miner.bin
            ./esp-miner-research.sha256
          if-no-files-found: error
